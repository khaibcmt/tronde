  <style>#edumix-auth-overlay{z-index:999999;-webkit-backdrop-filter:blur(12px);perspective:1200px;background:radial-gradient(circle at 50% 25%,#0f172ad9 0%,#020617f5 100%);justify-content:center;align-items:center;padding:16px;font-family:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif;display:none;position:fixed;inset:0}#edumix-auth-overlay.active{animation:.35s cubic-bezier(.16,1,.3,1) forwards edumixFadeIn;display:flex}@keyframes edumixFadeIn{0%{opacity:0}to{opacity:1}}.edumix-modal-3d{color:#f8fafc;background:linear-gradient(160deg,#1e293b 0%,#0f172a 60%,#090d16 100%);border:1px solid #94a3b838;border-radius:26px;width:100%;max-width:470px;padding:30px 28px 28px;transition:transform .3s,box-shadow .3s;position:relative;overflow:hidden;transform:translateY(0)rotateX(2deg);box-shadow:0 28px 60px -12px #000000d9,0 10px #090f1d,0 12px 25px #0ea5e938,inset 0 2px 2px #ffffff26}.edumix-modal-3d:before{content:"";pointer-events:none;background:radial-gradient(circle,#38bdf838 0%,#0000 70%);width:220px;height:220px;position:absolute;top:-80px;left:-80px}.edumix-modal-3d:after{content:"";pointer-events:none;background:radial-gradient(circle,#a855f733 0%,#0000 70%);width:220px;height:220px;position:absolute;bottom:-80px;right:-80px}.edumix-header-wrap{text-align:center;z-index:2;margin-bottom:22px;position:relative}.edumix-logo-3d{color:#fff;background:linear-gradient(135deg,#06b6d4 0%,#3b82f6 50%,#6366f1 100%);border-radius:20px;justify-content:center;align-items:center;width:72px;height:72px;margin:0 auto 12px;font-size:32px;animation:3s ease-in-out infinite edumixFloatLogo;display:flex;transform:translateY(-2px);box-shadow:0 8px #1e3a8a,0 14px 24px #3b82f673,inset 0 2px 3px #ffffff73}@keyframes edumixFloatLogo{0%,to{transform:translateY(-2px)}50%{transform:translateY(-7px)}}.edumix-app-title{letter-spacing:-.5px;background:linear-gradient(90deg,#38bdf8,#c084fc,#fbbf24);-webkit-text-fill-color:transparent;text-shadow:0 4px 16px #38bdf833;-webkit-backgr px;padding:15px 20px;font-size:15px;font-weight:800;transition:transform .12s,box-shadow .12s,filter .2s;display:flex;position:relative;transform:translateY(0);box-shadow:0 7px #1e3a8a,0 14px 28px #3b82f673,inset 0 2px 2px #ffffff59}.edumix-submit-btn-3d:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-2px);box-shadow:0 9px #1e3a8a,0 18px 32px #3b82f68c,inset 0 2px 2px #ffffff73}.edumix-submit-btn-3d:active:not(:disabled){transform:translateY(6px);box-shadow:0 1px #1e3a8a,0 4px 10px #3b82f659,inset 0 2px 4px #00000040}.edumix-submit-btn-3d:disabled{opacity:.75;cursor:wait}.edumix-footer-note{z-index:2;text-align:center;color:#64748b;margin-top:16px;font-size:11.5px;position:relative}</style>

  <div id="edumix-auth-overlay" role="dialog" aria-modal="true" aria-labelledby="edumix-modal-title">

      <div class="edumix-footer-note">

  <script>
    (function () {
      const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwdXDqUQbWShXFFYrgX17fCnhi0jc4TLFaoECm6DvTi8zcDO8i37dsxnLQfErZNRfj/exec";
      const USER_STORAGE_KEY = "tronde_current_user";
      const DEVICE_STORAGE_KEY = "tronde_device_id";

      function getOrCreateDeviceId() {
        try {
          let deviceId = localStorage.getItem(DEVICE_STORAGE_KEY);
          if (!deviceId) {
            const randomPart = (typeof crypto !== "undefined" && crypto.randomUUID)
              ? crypto.randomUUID()
              : "dev-" + Date.now().toString(36) + "-" + Math.random().toString(36).substring(2, 10);
            deviceId = "EDUMIX-" + randomPart.toUpperCase();
            localStorage.setItem(DEVICE_STORAGE_KEY, deviceId);
          }
          return deviceId;
        } catch (err) {
          return "EDUMIX-FALLBACK-" + Date.now();
        }
      }

      async function fetchClientIp() {
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(function () { controller.abort(); }, 3500);
          const res = await fetch("https://api.ipify.org?format=json", { signal: controller.signal });
          clearTimeout(timeoutId);
          if (res.ok) {
            const data = await res.json();
            if (data && data.ip) return String(data.ip);
          }
        } catch (e) {
          // Ignore IP fetch failure and use fallback
        }
        return "unknown";
      }

      function showError(msg) {
        const errBox = document.getElementById("edumix-auth-error");
        const errText = document.getElementById("edumix-auth-error-text");
        if (errBox && errText) {
          errText.textContent = msg;
          errBox.classList.remove("visible");
          void errBox.offsetWidth; // Reflow to re-trigger shake animation
          errBox.classList.add("visible");
        }
      }

      function hideError() {
        const errBox = document.getElementById("edumix-auth-error");
        if (errBox) {
          errBox.classList.remove("visible");
        }
      }

      function initAuthModal() {
        const overlay = document.getElementById("edumix-auth-overlay");
        const form = document.getElementById("edumix-auth-form");
        const gmailInput = document.getElementById("edumix-gmail");
        const teacherInput = document.getElementById("edumix-teacher-name");
        const schoolInput = document.getElementById("edumix-school-name");
        const submitBtn = document.getElementById("edumix-auth-submit");
        const submitText = document.getElementById("edumix-submit-text");
        const submitIcon = document.getElementById("edumix-submit-icon");

        if (!overlay || !form) return;

        // Luôn đảm bảo sinh mã máy duy nhất ("tronde_device_id") ngay khi tải trang
        const deviceId = getOrCreateDeviceId();

        // Kiểm tra localStorage "tronde_current_user"
        let currentUser = null;
        try {
          const rawUser = localStorage.getItem(USER_STORAGE_KEY);
          if (rawUser) {
            const parsed = JSON.parse(rawUser);
            if (parsed && parsed.gmail && parsed.teacherName && parsed.schoolName) {
              currentUser = parsed;
            }
          }
        } catch (e) {
          currentUser = null;
        }

        if (!currentUser) {
          overlay.classList.add("active");
        }

        form.addEventListener("submit", async function (e) {
          e.preventDefault();
          hideError();

          const gmail = (gmailInput ? gmailInput.value : "").trim();
          const teacherName = (teacherInput ? teacherInput.value : "").trim();
          const schoolName = (schoolInput ? schoolInput.value : "").trim();

          if (!gmail || !teacherName || !schoolName) {
            showError("Vui lòng điền đầy đủ cả 3 thông tin bắt buộc: Địa chỉ Gmail, Họ và tên Thầy / Cô và Trường công tác!");
            return;
          }

          const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
          if (!emailRegex.test(gmail)) {
            showError("Địa chỉ Gmail không hợp lệ. Vui lòng nhập đúng định dạng email (ví dụ: giaovien@gmail.com)!");
            return;
          }

          if (submitBtn) submitBtn.disabled = true;
          if (submitText) submitText.textContent = "ĐANG XÁC THỰC HỆ THỐNG...";
          if (submitIcon) submitIcon.className = "fa-solid fa-spinner fa-spin";

          try {
            const ipAddress = await fetchClientIp();
            const payload = {
              gmail: gmail,
              teacherName: teacherName,
              schoolName: schoolName,
              deviceId: deviceId,
              ipAddress: ipAddress,
              status: "active"
            };

            const response = await fetch(GOOGLE_SCRIPT_URL, {
              method: "POST",
              headers: {
                "Content-Type": "text/plain;charset=utf-8"
              },
              body: JSON.stringify(payload)
            });

            let result = null;
            try {
              const text = await response.text();
              result = text ? JSON.parse(text) : { status: "success" };
            } catch (parseErr) {
              result = { status: "success" };
            }

            if (result && (result.status === "duplicate" || result.status === "error")) {
              const serverMsg = result.message || (
                result.status === "duplicate"
                  ? "Tài khoản Gmail hoặc thiết bị này đã được đăng ký trên một thiết bị khác!"
                  : "Xác thực không thành công từ máy chủ. Vui lòng kiểm tra lại thông tin!"
              );
              showError(serverMsg);
              if (submitBtn) submitBtn.disabled = false;
              if (submitText) submitText.textContent = "VÀO PHẦN MỀM TRỘN ĐỀ";
              if (submitIcon) submitIcon.className = "fa-solid fa-rocket";
              return;
            }

            // Lưu thông tin vào localStorage "tronde_current_user" và ẩn modal
            try {
              localStorage.setItem(USER_STORAGE_KEY, JSON.stringify(payload));
            } catch (storageErr) {
              // Ignore storage quota errors
            }
            overlay.classList.remove("active");
          } catch (networkErr) {
            showError("Không thể kết nối đến máy chủ xác thực. Vui lòng kiểm tra kết nối mạng và thử lại!");
          } finally {
            if (submitBtn) submitBtn.disabled = false;
            if (submitText) submitText.textContent = "VÀO PHẦN MỀM TRỘN ĐỀ";
            if (submitIcon) submitIcon.className = "fa-solid fa-rocket";
          }
        });
      }

      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initAuthModal);
      } else {
        initAuthModal();
      }
    })();
  </script>
  <!-- ================= END EDU MIX 2025 AUTHENTICATION MODAL ================= -->
