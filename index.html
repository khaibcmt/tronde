<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduMix 2025 - Hệ Thống Trộn Đề Trắc Nghiệm Chuẩn Cấu Trúc</title>
    <meta name="description" content="Ứng dụng web tự động phân tích, sửa lỗi trực tiếp, trộn đề trắc nghiệm 3 phần chuẩn cấu trúc tốt nghiệp THPT 2025, dàn trang chống xô lệch và sinh mã QR chấm thi đa nền tảng." />
    <meta property="og:title" content="EduMix 2025 - Hệ Thống Trộn Đề Trắc Nghiệm Chuẩn Cấu Trúc" />
    <meta property="og:description" content="Ứng dụng web tự động phân tích, sửa lỗi trực tiếp, trộn đề trắc nghiệm 3 phần chuẩn cấu trúc tốt nghiệp THPT 2025, dàn trang chống xô lệch và sinh mã QR chấm thi đa nền tảng." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66U8qyl+" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
 <!-- ================= HỘP THOẠI ĐĂNG KÝ / ĐĂNG NHẬP GMAIL CHUẨN ================= -->
<div id="authGateModal" style="display:none; position:fixed; inset:0; z-index:999999; background:rgba(15,23,42,0.85); backdrop-filter:blur(5px); align-items:center; justify-content:center; padding:16px; font-family:sans-serif;">
  <div style="background:#fff; border-radius:18px; max-width:390px; width:100%; padding:28px; box-shadow:0 25px 50px -12px rgba(0,0,0,0.35); text-align:center;">
    <div style="width:52px; height:52px; background:#eff6ff; color:#2563eb; border-radius:14px; display:flex; align-items:center; justify-content:center; margin:0 auto 12px auto; font-size:22px;">
      <i class="fa-solid fa-envelope-circle-check"></i>
    </div>
    <h3 style="margin:0 0 6px 0; font-size:19px; font-weight:bold; color:#1e293b;">Đăng nhập sử dụng</h3>
    <p style="margin:0 0 18px 0; font-size:12.5px; color:#64748b; line-height:1.4;">Nhập Gmail và thông tin cá nhân để bắt đầu sử dụng phần mềm Tronde</p>

    <form id="formAuthGate" style="text-align:left;">
      <!-- 1. Ô GMAIL -->
      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:12px; font-weight:bold; color:#334155; margin-bottom:5px;">Địa chỉ Gmail: <span style="color:#ef4444;">*</span></label>
        <input type="email" id="authGmail" required placeholder="nhap_email@gmail.com" style="width:100%; box-sizing:border-box; padding:9px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:13.5px; outline:none;">
      </div>

      <!-- 2. Ô HỌ VÀ TÊN -->
      <div style="margin-bottom:12px;">
        <label style="display:block; font-size:12px; font-weight:bold; color:#334155; margin-bottom:5px;">Họ và tên Thầy / Cô: <span style="color:#ef4444;">*</span></label>
        <input type="text" id="authTeacherName" required placeholder="Ví dụ: Hồ Tấn Khải" style="width:100%; box-sizing:border-box; padding:9px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:13.5px; outline:none;">
      </div>
      
      <!-- 3. Ô TRƯỜNG -->
      <div style="margin-bottom:16px;">
        <label style="display:block; font-size:12px; font-weight:bold; color:#334155; margin-bottom:5px;">Trường công tác: <span style="color:#ef4444;">*</span></label>
        <input type="text" id="authSchoolName" required placeholder="Ví dụ: THPT Mang Thít" style="width:100%; box-sizing:border-box; padding:9px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:13.5px; outline:none;">
      </div>

      <div id="authErrorMsg" style="display:none; padding:10px; border-radius:8px; font-size:12px; font-weight:500; background:#fef2f2; color:#b91c1c; border:1px solid #fecaca; margin-bottom:14px; line-height:1.4;"></div>

      <button type="submit" id="btnSubmitAuth" style="width:100%; background:#2563eb; color:#fff; border:none; padding:11px; border-radius:8px; font-weight:bold; font-size:14px; cursor:pointer; transition:0.2s;">
        Xác nhận & Bắt đầu
      </button>
    </form>
  </div>
</div>

<script>
  (function() {
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzcvMr0k6HaQGSE792JcBz4k-XlmC6NAKbVGSf263XMiG4CjLZijPRzU889c_EJgKMy/exec";

    // Kiểm tra đăng nhập
    const savedUser = localStorage.getItem("tronde_current_user");
    const modal = document.getElementById("authGateModal");
    const errBox = document.getElementById("authErrorMsg");
    const btnSubmit = document.getElementById("btnSubmitAuth");

    if (!savedUser && modal) {
      modal.style.display = "flex";
    }

    // Mã máy duy nhất
    let deviceId = localStorage.getItem("tronde_device_id");
    if (!deviceId) {
      deviceId = "TRON-" + Math.random().toString(36).substring(2, 8).toUpperCase();
      localStorage.setItem("tronde_device_id", deviceId);
    }

    const form = document.getElementById("formAuthGate");
    if (form) {
      form.addEventListener("submit", async function(e) {
        e.preventDefault();
        errBox.style.display = "none";
        btnSubmit.disabled = true;
        btnSubmit.innerText = "Đang xác thực...";

        const gmailVal = document.getElementById("authGmail").value.trim().toLowerCase();
        const nameVal = document.getElementById("authTeacherName").value.trim();
        const schoolVal = document.getElementById("authSchoolName").value.trim();

        let ip = "---";
        try {
          const resIp = await fetch("https://api.ipify.org?format=json");
          const dIp = await resIp.json();
          ip = dIp.ip || "---";
        } catch (err) {}

        const payload = {
          gmail: gmailVal,
          teacherName: nameVal,
          schoolName: schoolVal,
          deviceId: deviceId,
          ipAddress: ip,
          status: "active"
        };

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (result.status === "duplicate" || result.status === "error") {
            errBox.innerText = "⚠️ " + result.message;
            errBox.style.display = "block";
            btnSubmit.disabled = false;
            btnSubmit.innerText = "Xác nhận & Bắt đầu";
          } else {
            localStorage.setItem("tronde_current_user", JSON.stringify({ gmail: gmailVal, name: nameVal, school: schoolVal }));
            modal.style.display = "none";
          }
        } catch (error) {
          localStorage.setItem("tronde_current_user", JSON.stringify({ gmail: gmailVal, name: nameVal, school: schoolVal }));
          modal.style.display = "none";
        }
      });
    }
  })();
</script>
  </body>
</html>
