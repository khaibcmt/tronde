<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduMix 2025 - Hệ Thống Trộn Đề Trắc Nghiệm Chuẩn Cấu Trúc</title>
    <meta name="description" content="Ứng dụng web tự động phân tích, sửa lỗi trực tiếp, trộn đề trắc nghiệm 3 phần chuẩn cấu trúc tốt nghiệp THPT 2025, dàn trang chống xô lệch và sinh mã QR chấm thi đa nền tảng." />
    <meta property="og:title" content="EduMix 2025 - Hệ Thống Trộn Đề Trắc Nghiệm Chuẩn Cấu Trúc" />
    <meta property="og:description" content="Ứng dụng web tự động phân tích, sửa lỗi trực tiếp, trộn đề trắc nghiệm 3 phần chuẩn cấu trúc tốt nghiệp THPT 2025, dàn trang chống xô lệch và sinh mã QR chấm thi đa nền tảng." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66U8qyl+" crossorigin="anonymous">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
<!-- ================= HỘP THOẠI ĐĂNG KÝ GMAIL 3D NỔI BẬT ================= -->
<style>
  @keyframes trondePulseGlow {
    0%, 100% { transform: scale(1); box-shadow: 0 0 15px rgba(59, 130, 246, 0.6), 0 0 30px rgba(139, 92, 246, 0.4); }
    50% { transform: scale(1.06); box-shadow: 0 0 25px rgba(236, 72, 153, 0.8), 0 0 45px rgba(59, 130, 246, 0.7); }
  }
  @keyframes badgeBlink {
    0%, 100% { opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
    50% { opacity: 0.45; filter: drop-shadow(0 0 2px #38bdf8); }
  }
  @keyframes gradientText {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  .tronde-input-3d {
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .tronde-input-3d:hover {
    transform: translateY(-2px);
  }
  .tronde-input-3d:focus-within {
    transform: translateY(-3px) scale(1.01);
  }
</style>

<div id="authGateModal" style="display:none; position:fixed; inset:0; z-index:999999; background:rgba(15,23,42,0.8); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); align-items:center; justify-content:center; padding:16px; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <div style="background:#ffffff; border-radius:28px; max-width:430px; width:100%; padding:32px 26px 26px 26px; box-shadow:0 30px 60px -15px rgba(15,23,42,0.5), 0 0 0 1px rgba(255,255,255,0.8) inset; text-align:center; position:relative; overflow:hidden;">
    
    <!-- Dải sáng phát quang trên đỉnh -->
    <div style="position:absolute; top:0; left:0; right:0; height:6px; background:linear-gradient(90deg, #06b6d4, #3b82f6, #8b5cf6, #ec4899); background-size:300% 300%; animation:gradientText 4s ease infinite;"></div>

    <!-- Điểm nhấp nháy trực quan phía trên -->
    <div style="display:inline-flex; align-items:center; gap:8px; padding:6px 16px; background:#0f172a; color:#fff; border-radius:30px; font-size:11.5px; font-weight:700; margin-bottom:14px; box-shadow:0 6px 16px rgba(15,23,42,0.25);">
      <span style="width:9px; height:9px; border-radius:50%; background:#22c55e; animation:badgeBlink 1.2s infinite ease-in-out;"></span>
      <span style="letter-spacing:0.8px; text-transform:uppercase; color:#f8fafc;">HỆ THỐNG XÁC THỰC GIÁO VIÊN</span>
    </div>

    <!-- LOGO 3D & TÊN WEB PHÁT QUANG -->
    <div style="margin-bottom:16px;">
      <div style="width:72px; height:72px; margin:0 auto 10px auto; border-radius:22px; background:linear-gradient(135deg, #2563eb, #7c3aed, #db2777); display:flex; align-items:center; justify-content:center; color:#fff; font-size:32px; animation:trondePulseGlow 3s infinite ease-in-out; border:2px solid #ffffff;">
        <i class="fa-solid fa-layer-group"></i>
      </div>
      <h2 style="margin:0 0 4px 0; font-size:24px; font-weight:900; letter-spacing:-0.5px; background:linear-gradient(135deg, #1e40af, #6d28d9, #be185d); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-size:200% 200%; animation:gradientText 4s ease infinite;">
        TRONDE • EDUMIX 2025
      </h2>
      <p style="margin:0; font-size:12.5px; color:#64748b; font-weight:500;">Công cụ trộn đề thi trắc nghiệm chuẩn Bộ Giáo Dục</p>
    </div>

    <form id="formAuthGate" style="text-align:left;">
      
      <!-- KHỐI 3D 1: ĐỊA CHỈ GMAIL (XANH DƯƠNG CYAN) -->
      <div class="tronde-input-3d" style="margin-bottom:14px; background:#f0f9ff; border:1.5px solid #bae6fd; border-radius:16px; padding:10px 14px; box-shadow:0 8px 20px -6px rgba(14, 165, 233, 0.25), 0 3px 6px rgba(0,0,0,0.03);">
        <label style="display:flex; justify-content:space-between; align-items:center; font-size:11.5px; font-weight:700; color:#0369a1; margin-bottom:5px;">
          <span><i class="fa-solid fa-envelope" style="margin-right:6px; color:#0284c7;"></i>Địa chỉ Gmail</span>
          <span style="color:#e11d48; font-size:10.5px;">* Bắt buộc</span>
        </label>
        <input type="email" id="authGmail" required placeholder="nhap_gmail_thayco@gmail.com" style="width:100%; box-sizing:border-box; padding:7px 10px; background:#ffffff; border:1px solid #7dd3fc; border-radius:10px; font-size:13.5px; font-weight:600; color:#0c4a6e; outline:none; box-shadow:inset 0 2px 4px rgba(0,0,0,0.04);">
      </div>

      <!-- KHỐI 3D 2: HỌ VÀ TÊN (TÍM HỒNG PASTEL) -->
      <div class="tronde-input-3d" style="margin-bottom:14px; background:#faf5ff; border:1.5px solid #e9d5ff; border-radius:16px; padding:10px 14px; box-shadow:0 8px 20px -6px rgba(168, 85, 247, 0.25), 0 3px 6px rgba(0,0,0,0.03);">
        <label style="display:flex; justify-content:space-between; align-items:center; font-size:11.5px; font-weight:700; color:#7e22ce; margin-bottom:5px;">
          <span><i class="fa-solid fa-user-tie" style="margin-right:6px; color:#9333ea;"></i>Họ và tên Thầy / Cô</span>
          <span style="color:#e11d48; font-size:10.5px;">* Bắt buộc</span>
        </label>
        <input type="text" id="authTeacherName" required placeholder="Ví dụ: Hồ Tấn Khải" style="width:100%; box-sizing:border-box; padding:7px 10px; background:#ffffff; border:1px solid #d8b4fe; border-radius:10px; font-size:13.5px; font-weight:600; color:#581c87; outline:none; box-shadow:inset 0 2px 4px rgba(0,0,0,0.04);">
      </div>

      <!-- KHỐI 3D 3: TRƯỜNG CÔNG TÁC (CAM VÀNG HỔ PHÁCH) -->
      <div class="tronde-input-3d" style="margin-bottom:18px; background:#fffbeb; border:1.5px solid #fde68a; border-radius:16px; padding:10px 14px; box-shadow:0 8px 20px -6px rgba(245, 158, 11, 0.25), 0 3px 6px rgba(0,0,0,0.03);">
        <label style="display:flex; justify-content:space-between; align-items:center; font-size:11.5px; font-weight:700; color:#b45309; margin-bottom:5px;">
          <span><i class="fa-solid fa-school" style="margin-right:6px; color:#d97706;"></i>Trường công tác</span>
          <span style="color:#e11d48; font-size:10.5px;">* Bắt buộc</span>
        </label>
        <input type="text" id="authSchoolName" required placeholder="Ví dụ: THPT Mang Thít" style="width:100%; box-sizing:border-box; padding:7px 10px; background:#ffffff; border:1px solid #fcd34d; border-radius:10px; font-size:13.5px; font-weight:600; color:#78350f; outline:none; box-shadow:inset 0 2px 4px rgba(0,0,0,0.04);">
      </div>

      <!-- Hộp báo lỗi -->
      <div id="authErrorMsg" style="display:none; padding:11px 14px; border-radius:12px; font-size:12.5px; font-weight:600; background:#fff1f2; color:#be123c; border:1px solid #fecdd3; margin-bottom:14px; line-height:1.4;"></div>

      <!-- NÚT BẤM 3D GRADIENT NỔI KHỐI -->
      <button type="submit" id="btnSubmitAuth" style="width:100%; background:linear-gradient(135deg, #2563eb, #4f46e5 50%, #7c3aed); color:#ffffff; border:none; padding:14px; border-radius:16px; font-weight:800; font-size:15px; cursor:pointer; box-shadow:0 12px 24px -6px rgba(79, 70, 229, 0.5), 0 4px 0 #3730a3; display:flex; align-items:center; justify-content:center; gap:9px; transition:all 0.15s ease;" onmousedown="this.style.transform='translateY(3px)'; this.style.boxShadow='0 4px 10px -2px rgba(79, 70, 229, 0.4), 0 1px 0 #3730a3';" onmouseup="this.style.transform='translateY(0)'; this.style.boxShadow='0 12px 24px -6px rgba(79, 70, 229, 0.5), 0 4px 0 #3730a3';">
        <span>VÀO PHẦN MỀM TRỘN ĐỀ</span>
        <i class="fa-solid fa-arrow-right-long"></i>
      </button>

      <p style="margin:12px 0 0 0; text-align:center; font-size:11px; color:#94a3b8; font-weight:500;">
        <i class="fa-solid fa-shield-halved" style="color:#10b981; margin-right:4px;"></i> Hệ thống lưu dữ liệu bảo mật và tự động ghi nhớ phiên dùng
      </p>
    </form>
  </div>
</div>

<script>
  (function() {
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzwdXDqUQbWShXFFYrgX17fCnhi0jc4TLFaoECm6DvTi8zcDO8i37dsxnLQfErZNRfj/exec";

    const savedUser = localStorage.getItem("tronde_current_user");
    const modal = document.getElementById("authGateModal");
    const errBox = document.getElementById("authErrorMsg");
    const btnSubmit = document.getElementById("btnSubmitAuth");

    if (!savedUser && modal) {
      modal.style.display = "flex";
    }

    let deviceId = localStorage.getItem("tronde_device_id");
    if (!deviceId) {
      deviceId = "TRON-" + Math.random().toString(36).substring(2, 8).toUpperCase();
      localStorage.setItem("tronde_device_id", deviceId);
    }

    const form = document.getElementById("formAuthGate");
    if (form) {
      form.addEventListener("submit", async function(e) {
        e.preventDefault();
        errBox.style.display = "none";
        btnSubmit.disabled = true;
        btnSubmit.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i><span>Đang xác nhận dữ liệu...</span>`;

        const gmailVal = document.getElementById("authGmail").value.trim().toLowerCase();
        const nameVal = document.getElementById("authTeacherName").value.trim();
        const schoolVal = document.getElementById("authSchoolName").value.trim();

        let ip = "---";
        try {
          const resIp = await fetch("https://api.ipify.org?format=json");
          const dIp = await resIp.json();
          ip = dIp.ip || "---";
        } catch (err) {}

        const payload = {
          gmail: gmailVal,
          teacherName: nameVal,
          schoolName: schoolVal,
          deviceId: deviceId,
          ipAddress: ip,
          status: "active"
        };

        try {
          const response = await fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            body: JSON.stringify(payload)
          });
          const result = await response.json();

          if (result.status === "duplicate" || result.status === "error") {
            errBox.innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="margin-right:6px;"></i>` + result.message;
            errBox.style.display = "block";
            btnSubmit.disabled = false;
            btnSubmit.innerHTML = `<span>VÀO PHẦN MỀM TRỘN ĐỀ</span><i class="fa-solid fa-arrow-right-long"></i>`;
          } else {
            localStorage.setItem("tronde_current_user", JSON.stringify({ gmail: gmailVal, name: nameVal, school: schoolVal }));
            modal.style.display = "none";
          }
        } catch (error) {
          localStorage.setItem("tronde_current_user", JSON.stringify({ gmail: gmailVal, name: nameVal, school: schoolVal }));
          modal.style.display = "none";
        }
      });
    }
  })();
</script>
  </body>
</html>
