  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  <script>
<script>
<script>
window.addEventListener('keydown', function(e) {
    if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || (e.ctrlKey && e.keyCode === 85)) {
        e.stopImmediatePropagation();
        e.preventDefault();
        alert('Tính năng này đã bị khóa để bảo vệ bản quyền!');
        return false;
    }
}, true);

window.addEventListener('contextmenu', function(e) {
    e.preventDefault();
}, true);

setInterval(function() {
    if (!document.body.innerText.includes('Hồ Tấn Khải') || !document.body.innerText.includes('Mang Thít')) {
        document.body.innerHTML = '<h1 style="color:red;text-align:center;margin-top:20vh;">CẢNH BÁO: Trang web đã bị chỉnh sửa thông tin bản quyền!</h1>';
    }
}, 1000);
</script>
