<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduMix 2025 - Hệ Thống Trộn Đề Trắc Nghiệm Chuẩn Cấu Trúc</title>
    <meta name="description" content="Ứng dụng web tự động phân tích, sửa lỗi trực tiếp, trộn đề trắc nghiệm 3 phần chuẩn cấu trúc tốt nghiệp THPT 2025, dàn trang chống xô lệch và sinh mã QR chấm thi đa nền tảng." />
    <meta property="og:title" content="EduMix 2025 - Hệ Thống Trộn Đề Trắc Nghiệm Chuẩn Cấu Trúc" />
    <meta property="og:description" content="Ứng dụng web tự động phân tích, sửa lỗi trực tiếp, trộn đề trắc nghiệm 3 phần chuẩn cấu trúc tốt nghiệp THPT 2025, dàn trang chống xô lệch và sinh mã QR chấm thi đa nền tảng." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  <script>
// 1. Chặn các phím tắt mở bảng lập trình (F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U)
document.addEventListener('keydown', function(e) {
    if (
        e.keyCode === 123 || // F12
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || // Ctrl+Shift+I / J
        (e.ctrlKey && e.keyCode === 85) // Ctrl+U
    ) {
        e.preventDefault();
        alert('Tính năng này đã bị khóa để bảo vệ bản quyền!');
        return false;
    }
});

// 2. Chặn bấm chuột phải để xem mã nguồn
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    alert('Bản quyền thuộc về Thầy Hồ Tấn Khải - THPT Mang Thít!');
});

// 3. Hệ thống tự động kiểm tra bảo vệ bản quyền (Chống xóa tên tác giả)
setInterval(function() {
    // Kiểm tra xem dòng tên tác giả còn hiển thị trên web không
    const bodyText = document.body.innerText;
    if (!bodyText.includes('Hồ Tấn Khải') && !bodyText.includes('Mang Thít')) {
        document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:20vh;">CẢNH BÁO: Trang web đã bị chỉnh sửa trái phép! Vui lòng giữ nguyên thông tin bản quyền của tác giả Hồ Tấn Khải.</h1>';
    }
}, 2000);
</script>
  </body>
</html>
