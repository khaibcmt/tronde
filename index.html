<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduMix 2025 - Hệ Thống Trộn Đề Trắc Nghiệm Chuẩn Cấu Trúc</title>
    <meta name="description" content="Ứng dụng web tự động phân tích, sửa lỗi trực tiếp, trộn đề trắc nghiệm 3 phần chuẩn cấu trúc tốt nghiệp THPT 2025, dàn trang chống xô lệch và sinh mã QR chấm thi đa nền tảng." />
    <meta property="og:title" content="EduMix 2025 - Hệ Thống Trộn Đề Trắc Nghiệm Chuẩn Cấu Trúc" />
    <meta property="og:description" content="Ứng dụng web tự động phân tích, sửa lỗi trực tiếp, trộn đề trắc nghiệm 3 phần chuẩn cấu trúc tốt nghiệp THPT 2025, dàn trang chống xô lệch và sinh mã QR chấm thi đa nền tảng." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  <script>
<script>
// Chặn mọi nỗ lực mở F12, Ctrl+U bằng cách bắt sự kiện toàn cục ở mức cao nhất
window.addEventListener('keydown', function(e) {
    if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || 
        (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83))
    ) {
        e.stopImmediatePropagation();
        e.preventDefault();
        alert('Tính năng này đã bị khóa để bảo vệ bản quyền!');
        return false;
    }
}, true);

// Chặn tuyệt đối chuột phải
window.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    alert('Bản quyền thuộc về Thầy Hồ Tấn Khải - THPT Mang Thít!');
}, true);

// Cơ chế tự động bảo vệ thông tin tác giả chống bị xóa/sửa
setInterval(function() {
    const pageContent = document.body.innerText;
    if (!pageContent.includes('Hồ Tấn Khải') || !pageContent.includes('Mang Thít')) {
        document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:20vh; font-family:sans-serif;">CẢNH BÁO: Trang web đã bị chỉnh sửa thông tin bản quyền trái phép!</h1>';
    }
}, 1000);
</script>
  </body>
</html>
