<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EduMix 2025 - Hệ Thống Trộn Đề Trắc Nghiệm Chuẩn Cấu Trúc</title>
    <meta name="description" content="Ứng dụng web tự động phân tích, sửa lỗi trực tiếp, trộn đề trắc nghiệm 3 phần chuẩn cấu trúc tốt nghiệp THPT 2025, dàn trang chống xô lệch và sinh mã QR chấm thi đa nền tảng." />
    <meta property="og:title" content="EduMix 2025 - Hệ Thống Trộn Đề Trắc Nghiệm Chuẩn Cấu Trúc" />
    <meta property="og:description" content="Ứng dụng web tự động phân tích, sửa lỗi trực tiếp, trộn đề trắc nghiệm 3 phần chuẩn cấu trúc tốt nghiệp THPT 2025, dàn trang chống xô lệch và sinh mã QR chấm thi đa nền tảng." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  <script>
<script>
// 1. Chặn phím tắt và hiện thông báo nhắc nhở nhẹ nhàng
document.addEventListener('keydown', function(e) {
    if (
        e.keyCode === 123 || 
        (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74)) || 
        (e.ctrlKey && e.keyCode === 85)
    ) {
        e.preventDefault();
        alert('Trang web được xây dựng và bảo vệ bản quyền bởi Thầy Hồ Tấn Khải. Mong bạn tôn trọng tác giả nhé!');
        return false;
    }
});

// 2. Chặn chuột phải và thông báo nhẹ nhàng
document.addEventListener('contextmenu', function(e) {
    e.preventDefault();
    alert('Bản quyền thuộc về Thầy Hồ Tấn Khải - THPT Mang Thít!');
});

// 3. Tự động bảo vệ bản quyền (Kiểm tra tên tác giả)
setInterval(function() {
    const bodyText = document.body.innerText;
    if (!bodyText.includes('Hồ Tấn Khải') || !bodyText.includes('Mang Thít')) {
        document.body.innerHTML = '<h1 style="color:red; text-align:center; margin-top:20vh;">CẢNH BÁO: Trang web đã bị thay đổi thông tin tác giả! Vui lòng giữ nguyên bản quyền của Thầy Hồ Tấn Khải.</h1>';
    }
}, 2000);
</script>
  </body>
</html>
