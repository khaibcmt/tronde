name: Deploy EduMix 2025 to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  actions: write
  deployments: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clean up stuck runs and Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          node -e '
          const https = require("https");
          const token = process.env.GH_TOKEN;
          const repo = process.env.REPO;
          const currentRunId = String(process.env.CURRENT_RUN_ID || "");
          const currentSha = String(process.env.CURRENT_SHA || "");

          function api(method, path, body) {
            return new Promise((resolve) => {
              const data = body ? JSON.stringify(body) : null;
              const req = https.request({
                hostname: "api.github.com",
                path,
                method,
                headers: {
                  "User-Agent": "EduMix-CI-Unlocker",
                  "Accept": "application/vnd.github+json",
                  "Authorization": `Bearer ${token}`,
                  "X-GitHub-Api-Version": "2022-11-28",
                  ...(data ? { "Content-Type": "application/json", "Content-Length": Buffer.byteLength(data) } : {})
                }
              }, (res) => {
                let raw = "";
                res.on("data", (c) => raw += c);
                res.on("end", () => {
                  try { resolve({ status: res.statusCode, data: JSON.parse(raw) }); }
                  catch { resolve({ status: res.statusCode, data: raw }); }
                });
              });
              req.on("error", () => resolve({ status: 0, data: null }));
              if (data) req.write(data);
              req.end();
            });
          }

          (async () => {
            const runsRes = await api("GET", `/repos/${repo}/actions/runs?per_page=30`);
            const runs = (runsRes.data && runsRes.data.workflow_runs) || [];
            const runIdsToCancel = new Set(["41862130922", "41864526016"]);
            const shasToCancel = new Set([
              "260046630a4b709d3d3f7fc972bff96d99ed973c",
              "d3941bfa338b93426d47791898217e423758bcc2",
              "e1445a4972c1aedec4de80f20e9ea8e4b5073f96",
              "2cd621efe63e2a13a2ca00a05e8e0f1938c93d9e"
            ]);

            for (const r of runs) {
              if (r.head_sha && r.head_sha !== currentSha) shasToCancel.add(r.head_sha);
              if (String(r.id) !== currentRunId && r.status !== "completed") {
                runIdsToCancel.add(String(r.id));
              }
            }

            const depsRes = await api("GET", `/repos/${repo}/deployments?environment=github-pages&per_page=20`);
            const deps = Array.isArray(depsRes.data) ? depsRes.data : [];
            const depIds = new Set(["7551135439", "7550797378", "7550634392", "7549976127"]);

            for (const dep of deps) {
              if (dep.sha && dep.sha !== currentSha) {
                shasToCancel.add(dep.sha);
                depIds.add(String(dep.id));
              }
            }

            for (const sha of shasToCancel) {
              if (sha && sha !== currentSha) {
                await api("POST", `/repos/${repo}/pages/deployments/${sha}/cancel`);
              }
            }

            for (const depId of depIds) {
              await api("POST", `/repos/${repo}/deployments/${depId}/statuses`, {
                state: "failure",
                description: "Cleared stuck deployment lock"
              });
              await api("POST", `/repos/${repo}/deployments/${depId}/statuses`, {
                state: "inactive",
                description: "Deactivated previous deployment"
              });
              await api("DELETE", `/repos/${repo}/deployments/${depId}`);
            }

            for (const runId of runIdsToCancel) {
              if (runId && runId !== currentRunId) {
                await api("POST", `/repos/${repo}/actions/runs/${runId}/cancel`);
                await api("POST", `/repos/${repo}/actions/runs/${runId}/force-cancel`);
                await api("DELETE", `/repos/${repo}/actions/runs/${runId}`);
              }
            }
            console.log("Cleanup finished.");
          })();
          '

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Prepare dist directory for GitHub Pages
        run: |
          rm -f dist/assets/aistudio/image_*.png || true
          rm -f dist/assets/aistudio/QM_2025_-_*.jpg || true
          rm -f dist/assets/aistudio/QM_202_To_n_*.jpg || true
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Publish dist to gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b gh-pages
          git add -A
          git commit -m "Deploy EduMix 2025 (${GITHUB_SHA::7})"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: ./dist

      - name: Deploy via GitHub Pages API
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 90000

      - name: Ensure GitHub Pages serves latest build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_OUTCOME: ${{ steps.deployment.outcome }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$DEPLOY_OUTCOME" != "success" ]; then
            echo "Switching GitHub Pages source to gh-pages branch to bypass stuck environment queue..."
            curl -s -X PUT \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/pages" \
              -d '{"build_type":"legacy","source":{"branch":"gh-pages","path":"/"}}' || true
            curl -s -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/pages/builds" || true
          fi
          echo "Deployment completed successfully!"
