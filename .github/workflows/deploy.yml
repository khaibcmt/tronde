name: Deploy EduMix 2025 to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Build production bundle
        run: npm run build

      - name: Clean temporary chat screenshots from dist artifact
        run: |
          rm -f dist/assets/aistudio/image_*.png || true
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 15
    steps:
      - name: Cancel any stuck previous Pages deployments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SHAS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=15" | node -e "
            try {
              const d = JSON.parse(require('fs').readFileSync(0, 'utf8'));
              const list = (d.workflow_runs || []).map(r => r.head_sha).filter(Boolean);
              list.push('260046630a4b709d3d3f7fc972bff96d99ed973c');
              console.log([...new Set(list)].join(' '));
            } catch {
              console.log('260046630a4b709d3d3f7fc972bff96d99ed973c');
            }
          ")
          for sha in $SHAS; do
            if [ "$sha" != "${{ github.sha }}" ]; then
              curl -s -X POST \
                -H "Accept: application/vnd.github+json" \
                -H "Authorization: Bearer $GH_TOKEN" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "https://api.github.com/repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 || true
            fi
          done
          sleep 3

      - name: Deploy to GitHub Pages (Attempt 1)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 240000

      - name: Clear lock and Retry Deploy if Attempt 1 failed
        if: steps.deployment.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/pages/deployments/${{ github.sha }}/cancel" >/dev/null 2>&1 || true
          sleep 5

      - name: Retry Deploy to GitHub Pages
        id: deployment_retry
        if: steps.deployment.outcome != 'success'
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000


